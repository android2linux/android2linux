<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kiosk trial</title>
<style>
  :root { color-scheme: dark; font-family: system-ui, sans-serif; }
  body { margin: 0; background: #111; color: #eee; }
  header { position: sticky; top: 0; z-index: 1; background: #222; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; }
  #fps { font: 700 28px ui-monospace, monospace; color: #7f7; }
  section { padding: 16px; border-bottom: 1px solid #333; }
  h2 { margin: 0 0 8px; font-size: 18px; }
  dl { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; margin: 0; font-size: 14px; }
  dt { color: #999; } dd { margin: 0; word-break: break-word; }
  .spinners { display: flex; gap: 12px; flex-wrap: wrap; }
  .spin { width: 48px; height: 48px; border-radius: 10px; background: linear-gradient(135deg, #f80, #f0a); animation: spin 1.2s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg) scale(1.1); } }
  canvas { width: 100%; height: 220px; display: block; background: #000; border-radius: 12px; }
  input { width: 100%; box-sizing: border-box; font-size: 18px; padding: 12px; border-radius: 10px; border: 1px solid #555; background: #1a1a1a; color: #eee; }
  li { padding: 14px 4px; border-bottom: 1px solid #2a2a2a; list-style: none; }
  ul { margin: 0; padding: 0; }
</style>
</head>
<body>
<header><strong>Kiosk trial</strong><span id="fps">-- fps</span></header>

<section>
  <h2>Device</h2>
  <dl id="info"></dl>
</section>

<section>
  <h2>CSS animation</h2>
  <div class="spinners" id="spinners"></div>
</section>

<section>
  <h2>WebGL</h2>
  <canvas id="gl"></canvas>
</section>

<section>
  <h2>Text input</h2>
  <input placeholder="Tap here: no on-screen keyboard in cage">
</section>

<section>
  <h2>Scrolling</h2>
  <ul id="list"></ul>
</section>

<script>
// Frames per second, averaged over each second.
const fpsEl = document.getElementById('fps');
let frames = 0, last = performance.now();
(function tick(now) {
  frames++;
  if (now - last >= 1000) { fpsEl.textContent = Math.round(frames * 1000 / (now - last)) + ' fps'; frames = 0; last = now; }
  requestAnimationFrame(tick);
})(last);

// What the browser reports about the device and its GPU.
const canvas = document.getElementById('gl');
const gl = canvas.getContext('webgl');
const dbg = gl && gl.getExtension('WEBGL_debug_renderer_info');
const rows = {
  'User agent': navigator.userAgent,
  'Viewport': `${innerWidth} × ${innerHeight} CSS px`,
  'Pixel ratio': devicePixelRatio,
  'Screen': `${screen.width} × ${screen.height}`,
  'Touch points': navigator.maxTouchPoints,
  'WebGL vendor': dbg ? gl.getParameter(dbg.UNMASKED_VENDOR_WEBGL) : (gl ? gl.getParameter(gl.VENDOR) : 'no WebGL'),
  'WebGL renderer': dbg ? gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL) : (gl ? gl.getParameter(gl.RENDERER) : 'no WebGL'),
  'CPU threads': navigator.hardwareConcurrency,
  'Memory (GB, approx.)': navigator.deviceMemory ?? 'n/a',
};
document.getElementById('info').innerHTML =
  Object.entries(rows).map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join('');

// A row of spinning boxes, animated by the compositor.
document.getElementById('spinners').innerHTML = '<div class="spin"></div>'.repeat(12);

// A spinning, colour-cycling triangle field, drawn with WebGL every frame.
if (gl) {
  const vs = `attribute vec2 p; uniform float t; varying vec3 c;
    void main() { float a = t + p.x * 3.0; mat2 r = mat2(cos(a), -sin(a), sin(a), cos(a));
      gl_Position = vec4(r * (p * 0.8), 0.0, 1.0); c = 0.5 + 0.5 * cos(t + p.xyx * 4.0 + vec3(0, 2, 4)); }`;
  const fs = `precision mediump float; varying vec3 c; void main() { gl_FragColor = vec4(c, 1.0); }`;
  const sh = (type, src) => { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); return s; };
  const prog = gl.createProgram();
  gl.attachShader(prog, sh(gl.VERTEX_SHADER, vs)); gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(prog); gl.useProgram(prog);
  const pts = [];
  for (let i = 0; i < 3000; i++) { const x = Math.random() * 2 - 1, y = Math.random() * 2 - 1, s = 0.03;
    pts.push(x, y, x + s, y, x, y + s); }
  const buf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(pts), gl.STATIC_DRAW);
  const loc = gl.getAttribLocation(prog, 'p'); gl.enableVertexAttribArray(loc);
  gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
  const tLoc = gl.getUniformLocation(prog, 't');
  (function draw(now) {
    canvas.width = canvas.clientWidth * devicePixelRatio; canvas.height = canvas.clientHeight * devicePixelRatio;
    gl.viewport(0, 0, canvas.width, canvas.height); gl.clearColor(0, 0, 0, 1); gl.clear(gl.COLOR_BUFFER_BIT);
    gl.uniform1f(tLoc, now / 1000); gl.drawArrays(gl.TRIANGLES, 0, pts.length / 2);
    requestAnimationFrame(draw);
  })(0);
}

// A long list for scrolling.
document.getElementById('list').innerHTML =
  Array.from({ length: 400 }, (_, i) => `<li>Row ${i + 1}: smooth scrolling test</li>`).join('');
</script>
</body>
</html>
